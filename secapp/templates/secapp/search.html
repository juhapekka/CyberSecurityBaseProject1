<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>
</head>
<body>
    <h1>Search Results</h1>

    <a href="/">Back to main page</a>

    <h2>Results for your query</h2>
    <ul>
        {% for result in results %}
            <li>
                <!-- SQL Injection show raw db entries as strings (or maybe tuples?) -->
                {{ result }}
            </li>
        {% empty %}
            <li>No notes found matching your criteria.</li>
        {% endfor %}
    </ul>
</body>
</html>
